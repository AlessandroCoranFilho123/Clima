<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="/imagens/favicon.ico">
</head>

<body>

    <div class="clima-card">
        <header>
            <div class="localizacao">
                <img src="/imagens/localizacao.webp"></i>
                <span>Limeira, SP</span>
            </div>
            <h2 class="hora">16:00</h2>
        </header>

        <main class="main-info">
            <div>
                <img class="sol-icon" src="/imagens/sol.webp"></i>
            </div>
            <div>
                <h1 class="temperatura">28°</h1>
                <p class="descricao">Ensolarado</p>
            </div>
        </main>

        <footer class="detalhes">
            <div class="detalhes-item">
                <img src="imagens/vento.webp">
                <div class="data">
                    <span class="label">Vento</span>
                    <span class="valor">5 km/h</span>
                </div>
            </div>
            <div class="detalhes-item">
                <img src="imagens/direcao.webp">
                <div class="data">
                    <span class="label">Direção</span>
                    <span class="valor">Norte</span>
                </div>
            </div>
            <div class="detalhes-item">
                <img src="imagens/umidade.webp">
                <div class="data">
                    <span class="label">Umidade</span>
                    <span class="valor">47%</span>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>
