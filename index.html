<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="imagens/favicon.ico">
</head>

<body>

    <div class="clima-card">
        <header>
            <div class="localizacao">
                <img src="imagens/localizacao.webp" alt="Localização">
                <span>Carregando...</span>
            </div>
            <h2 class="hora">16:00</h2>
        </header>

        <main class="main-info">
            <div>
                <img class="sol-icon" src="imagens/sol.svg" alt="Ícone do tempo">
            </div>
            <div>
                <h1 class="temperatura">--°</h1>
                <p class="descricao">Carregando...</p>
            </div>
        </main>

        <footer class="detalhes">
            <div class="detalhes-item">
                <img src="imagens/vento.webp" alt="Vento">
                <div class="data">
                    <span class="label">Vento</span>
                    <span class="valor vento">--</span>
                </div>
            </div>
            <div class="detalhes-item">
                <img src="imagens/direcao.webp" alt="Direção">
                <div class="data">
                    <span class="label">Direção</span>
                    <span class="valor direcao">--</span>
                </div>
            </div>
            <div class="detalhes-item">
                <img src="imagens/umidade.webp" alt="Umidade">
                <div class="data">
                    <span class="label">Umidade</span>
                    <span class="valor umidade">--</span>
                </div>
            </div>
        </footer>
    </div>

    <script src="/js/script.js"></script>
</body>

</html>
